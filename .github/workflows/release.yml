name: Any Listen Windows Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      DESKTOP_ONLY: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: node scripts/verify-release.mjs --source-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
      - run: node scripts/verify-release.mjs
      - name: Create draft release with complete update artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem build/*-x64-Setup.exe, build/*-x64-Setup.exe.blockmap, build/latest.yml | ForEach-Object FullName)
          $assets += (Resolve-Path packages/desktop/publish/version.json).Path
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --draft --title "Any Listen $env:GITHUB_REF_NAME" --notes-file packages/desktop/publish/changeLog.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
